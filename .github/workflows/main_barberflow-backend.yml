name: Build and deploy Node.js app to Azure Web App - barberflow-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        working-directory: ./barbearia-backend
        run: npm install

      - name: Build
        working-directory: ./barbearia-backend
        run: npm run build --if-present

      - name: Test
        working-directory: ./barbearia-backend
        run: npm run test --if-present

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./barbearia-backend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_38AE789CF20744899DBD7F3AD4C6FE7F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DC824C8F83664A61BE491E1C9C137C80 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FFB2936C3841475F9AC0646F78C68224 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'barberflow-backend'
          slot-name: 'Production'
          package: .